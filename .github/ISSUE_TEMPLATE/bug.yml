name: Bug report
description: Something broke or behaves unexpectedly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the behavior you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Repro steps
      description: Minimum steps to reproduce. Commands, inputs, environment.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: "e.g. v0.2.3 or abc123"
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, environment notes.
