name: Docs dispatch

# Fires on push to main when content that affects the published docs site
# changes (docs/, README, or CHANGELOG). Notifies makegov/docs via
# repository_dispatch so the docs site rebuilds without waiting for someone
# to push to the composer.
#
# tango-python is a `coloc-source` repo: its docs/ folder is the authoritative
# source for the Python SDK pages on docs.makegov.com (see makegov/docs#15).
#
# Required secrets — both are ORG secrets with `visibility: selected`, so this repo has to be on their selected list or every dispatch fails auth:
#   DISPATCHBOT_APP_ID      — the makegov-dispatchbot App.
#   DISPATCHBOT_PRIVATE_KEY — its private key.
#
# The App mints a short-lived installation token scoped to makegov/docs, the one repo this dispatches to.
#
# Required variables (optional):
#   DOCS_TARGET_REPO — override the dispatch target (default: makegov/docs).

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Every `${{ }}` value reaches the scripts through `env:`, never inline, so a file name or event field cannot inject shell.
      - name: Detect changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # The empty-tree object: diffing against it lists every tracked file.
          empty_tree=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          # Without a usable `before` (a manual run, a new branch, or a force-push whose old tip is gone) the push range is unknown, so dispatch regardless and report the tip commit's paths.
          force=false
          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qx '0*' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            force=true
            if git rev-parse --verify -q HEAD~1 >/dev/null; then
              base=HEAD~1
            else
              base="$empty_tree"
            fi
          fi
          external=$(git diff --name-only "$base" HEAD -- 'docs' 'README.md' 'CHANGELOG.md' | paste -sd, -)
          if [ -n "$external" ] || [ "$force" = true ]; then
            has_external=true
          else
            has_external=false
          fi
          {
            echo "external=$external"
            echo "has_external=$has_external"
          } >> "$GITHUB_OUTPUT"

      - name: Mint an installation token for the docs composer
        if: steps.changes.outputs.has_external == 'true'
        id: docs_composer
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DISPATCHBOT_APP_ID }}
          private-key: ${{ secrets.DISPATCHBOT_PRIVATE_KEY }}
          owner: makegov
          # Scoped to the single repo this step dispatches to, so a leaked token can't reach the rest of the org. A repository_dispatch needs Contents:write on the receiving repo.
          repositories: docs

      - name: Dispatch to docs composer (makegov/docs)
        if: steps.changes.outputs.has_external == 'true'
        env:
          GH_TOKEN: ${{ steps.docs_composer.outputs.token }}
          TARGET: ${{ vars.DOCS_TARGET_REPO || 'makegov/docs' }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ github.sha }}
          CHANGED_PATHS: ${{ steps.changes.outputs.external }}
        run: |
          gh api "repos/$TARGET/dispatches" \
            -f event_type=external_updated \
            -f "client_payload[source_repo]=$SOURCE_REPO" \
            -f "client_payload[source_ref]=$SOURCE_REF" \
            -f "client_payload[changed_paths]=$CHANGED_PATHS"
